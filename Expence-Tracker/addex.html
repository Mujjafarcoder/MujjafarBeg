<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Expense</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />
  <style>
    .expense-box {
      max-width: 500px;
      margin: 50px auto;
      padding: 30px;
      background: #f8f9fa;
      border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }

    .expense-box input,
    .expense-box textarea {
      margin-bottom: 15px;
    }

    #exadd {
      width: 100%;
    }

    #error {
      color: red;
      margin-bottom: 10px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="expense-box">
    <h3 class="text-center mb-4">Add New Expense</h3>
    <p id="error"></p>
    <input type="text" id="addexp" class="form-control" placeholder="Enter Expense Name">
    <input type="number" id="addamo" class="form-control" placeholder="Enter Amount">
    <input type="date" id="adddate" class="form-control" placeholder="Enter Date">
    <textarea id="adddes" class="form-control" placeholder="Description"></textarea>
    <button class="btn btn-success" id="exadd">Add Expense</button>

  </div>

  <script src="addex.js"></script>
</body>
</html>
