<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    crossorigin="anonymous"
  />

  <style>
    .singupbox {
      margin: auto;
      width: 500px;
      text-align: center;
      margin-top: 50px;
      justify-content: center;
    }

    #subBTN {
      border-radius: 10px;
      width: 100%;
      background-color: #28a745;
      color: white;
      padding: 10px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    #subBTN:hover {
      background-color: #218838;
    }

    #login {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      background-color: #007bff;
      color: white;
      padding: 10px 25px;
      border-radius: 8px;
      font-weight: 500;
      transition: 0.3s;
    }

    #login:hover {
      background-color: #0056b3;
    }

    h3 {
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="singupbox">
    <div class="container">
      <div class="row">
        <h3>Register Here</h3>
        <input id="UserInput" class="mt-2 form-control" type="text" placeholder="Enter UserName" />
        <input id="emailInput" class="mt-2 form-control" type="email" placeholder="Enter Gmail" />
        <input id="UserPass" class="mt-2 form-control" type="password" placeholder="Enter Password" />
        <input id="Fullname" class="mt-2 form-control" type="text" placeholder="Enter Full Name" />

        <button id="subBTN" class="mt-4">Submit</button>
        <a id="login" href="Login.html">Go to Login</a>
      </div>
    </div>
  </div>

  <script src="index.js"></script>
</body>
</html>
